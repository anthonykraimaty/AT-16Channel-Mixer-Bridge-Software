<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0d0e10">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Mixer</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/page.css">
  <link rel="stylesheet" href="css/menu.css">
</head>
<body>
  <div class="app" id="app">
    <header class="topbar">
      <div class="bar bar-mix">
        <nav class="chips" id="mixChips" aria-label="Mix"></nav>
        <div class="tools">
          <button class="tool tool-alarm" id="allMuted" type="button" hidden title="Bring the mutes back to how they were (Shift + Space)">
            <span>All muted</span>
          </button>
          <button class="tool" id="saveConfig" type="button" title="Save the configuration">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v10m0 0l-4-4m4 4l4-4M5 17v2h14v-2"/></svg>
            <span>Save</span>
          </button>
          <button class="tool" id="loadConfig" type="button" title="Load a configuration">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V5m0 0L8 9m4-4l4 4M5 17v2h14v-2"/></svg>
            <span>Load</span>
          </button>
        </div>
        <button class="brand" id="brand" type="button" aria-label="Menu">
          <span class="brand-name" id="brandName">MIXER</span>
          <span class="led" id="led"></span>
        </button>
      </div>
      <div class="bar bar-view">
        <span class="bar-label" id="modeLabel">VIEW</span>
        <nav class="chips chips-small" id="viewChips" aria-label="View"></nav>
      </div>
    </header>

    <main class="console" id="console">
      <section class="strips" id="strips" aria-label="Channels"></section>
      <aside class="master" id="master" aria-label="Master"></aside>
    </main>

    <section class="page" id="page" hidden aria-label="Channel settings"></section>

    <div class="veil" id="veil" hidden>
      <div class="veil-box">
        <div class="veil-title" id="veilTitle">Connecting</div>
        <div class="veil-text" id="veilText"></div>
        <button class="button veil-action" id="veilAction" type="button" hidden>Change mixer address</button>
      </div>
    </div>
  </div>

  <div class="sheet-backdrop" id="backdrop" hidden></div>
  <section class="sheet" id="sheet" hidden role="dialog" aria-modal="true"></section>
  <div class="toast" id="toast" hidden role="status"></div>

  <script src="js/model.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
